[package]
name = "softpasses"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.6.10", features = ["derive"] }
embree4-sys = { git = "https://github.com/mixiate/embree4-sys.git" }
fastrand = "2.3.0"
glam = "0.30.5"
gltf = "1.4.1"
image = "0.25.6"
itertools = "0.14.0"
load_image = "3.3.0"
oidn = { git = "https://github.com/bubba2k/oidn-rs", branch = "master" }
radiant = "0.3.0"
rand = "0.9.1"
rayon = "1.10.0"
tobj = "4.0.3"

[patch.crates-io]
# Upstream (psytrx/embree4-sys) still vendors Embree 4.2 headers. This fork
# updates them to 4.4.1, so the generated bindings (notably `RTCHit` with
# `instPrimID`) match the ABI of the installed Embree runtime.
embree4-sys = { git = "https://github.com/mixiate/embree4-sys.git" }
